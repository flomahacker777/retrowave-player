name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "source-bundle/**"
      - "retrowave-player/**"
      - "assemble.sh"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          cat source-bundle/part-00.bin source-bundle/part-01.bin source-bundle/part-02.bin source-bundle/part-03.bin source-bundle/part-04.bin > retrowave-player.tar.xz
          tar -xJf retrowave-player.tar.xz
          test -f retrowave-player/gradle.properties
          test -f retrowave-player/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests and build APK
        working-directory: retrowave-player
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          test -s retrowave-player/app/build/outputs/apk/debug/app-debug.apk
          ls -lh retrowave-player/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: retrowave-player-debug-apk
          path: retrowave-player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
